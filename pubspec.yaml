name: orva
description: Aplicativo pessoal de organização, rotina e evolução.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  intl: ^0.20.2
  cross_file: ^0.3.5
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  device_preview: ^3.0.0
  crypto: ^3.0.6
  local_auth: ^2.3.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Fontes de identidade visual do Orva (Fraunces/Inter/JetBrains Mono).
